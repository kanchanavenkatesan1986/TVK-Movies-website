<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloudflare R2 Uploader</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:500px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#1e293b;
}

label{
    font-weight:600;
    color:#475569;
}

#folder{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

#folder:focus{
    border-color:#3b82f6;
}

.upload-box{
    margin-top:20px;
    border:2px dashed #3b82f6;
    border-radius:15px;
    text-align:center;
    padding:50px 20px;
    cursor:pointer;
    background:#f8fafc;
    transition:.3s;
}

.upload-box:hover{
    background:#eff6ff;
}

.upload-box h3{
    color:#1e293b;
}

.upload-box p{
    color:#64748b;
    margin-top:10px;
}

#fileInput{
    display:none;
}

#status{
    margin-top:20px;
    text-align:center;
    font-weight:600;
    color:#16a34a;
}
```css
.progress{
    width:100%;
    height:25px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}

#bar{
    width:0%;
    height:100%;
    background:linear-gradient(
    90deg,
    #22c55e,
    #16a34a
    );
    transition:.2s;
}
```


</style>
</head>
<body>

<div class="container">

    <h2>☁ Cloudflare R2 Uploader</h2>

    <label>Folder Path</label>

    <input
    type="text"
    id="folder"
    placeholder="Hollywood/2019/Avengers-Endgame">

    <div class="upload-box" onclick="fileInput.click()">

        <h3>📁 Select Files</h3>

        <p>Click here to choose files</p>

    </div>

    <input
    type="file"
    id="fileInput"
    multiple>

<div class="progress">

    <div id="bar"></div>

</div>

    <div id="status"></div>

</div>


<script>

const workerURL =
"https://tvk-file.akatsuki-pvt-ltd.workers.dev/";

const fileInput =
document.getElementById("fileInput");

const status =
document.getElementById("status");

fileInput.addEventListener(
"change",
async function(){

    const folder =
    document.getElementById("folder").value;

    const totalFiles =
    this.files.length;

    for(let i=0;i<totalFiles;i++){

        const file =
        this.files[i];

        const formData =
        new FormData();

        formData.append(
        "file",
        file
        );

        formData.append(
        "folder",
        folder
        );

        await uploadFile(
        file,
        formData,
        i+1,
        totalFiles
        );

    }

    status.innerHTML =
    "✅ All uploads completed";

});

function uploadFile(
file,
formData,
currentFile,
totalFiles
){

return new Promise(
(resolve,reject)=>{

    const xhr =
    new XMLHttpRequest();

    xhr.open(
    "POST",
    workerURL
    );

    const startTime =
    Date.now();

    xhr.upload.onprogress =
    function(e){

        if(!e.lengthComputable)
        return;

        const percent =
        Math.round(
        (e.loaded/e.total)*100
        );

        const elapsed =
        (Date.now()-startTime)/1000;

        const speed =
        e.loaded/elapsed;

        const speedMB =
        (speed/1024/1024)
        .toFixed(2);

        const uploadedMB =
        (e.loaded/1024/1024)
        .toFixed(2);

        const totalMB =
        (e.total/1024/1024)
        .toFixed(2);

        const remainSec =
        speed>0
        ? Math.round(
        (e.total-e.loaded)/speed
        )
        : 0;

        status.innerHTML =

        `
        <b>
        File ${currentFile}/${totalFiles}
        </b>

        <br><br>

        📄 ${file.name}

        <br><br>

        ${percent}%

        <br>

        ${uploadedMB} MB /
        ${totalMB} MB

        <br>

        🚀 Speed :
        ${speedMB} MB/s

        <br>

        ⏳ Remaining :
        ${remainSec} sec
        `;

        document
        .getElementById("bar")
        .style.width =
        percent + "%";

    };

    xhr.onload =
    function(){

        document
        .getElementById("bar")
        .style.width =
        "100%";

        resolve();

    };

    xhr.onerror =
    reject;

    xhr.send(
    formData
    );

});
}

</script>



</body>
</html>
