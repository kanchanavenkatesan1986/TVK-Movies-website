<script>

    const popup = document.getElementById("sharePopup");
const closeBtn = document.getElementById("closePopup");
const timerText = document.getElementById("timer");

let seconds = 10;

const countdown = setInterval(() => {

    seconds--;

    timerText.innerText = seconds;

    if(seconds <= 0){
        clearInterval(countdown);
        popup.style.display = "none";
    }

},1000);

closeBtn.addEventListener("click",()=>{

    clearInterval(countdown);

    popup.style.display = "none";

});


document.getElementById("shareBtn").addEventListener("click",()=>{

const shareText =
`🎬 TVK Movies – தமிழ் Cinemas

தமிழ் & Hollywood Movies - யை இலவசமாக காணுங்கள் “TVK - Movies” - ல்.

🔥 Watch the Latest தமிழ் & Hollywood Movies
🎥 HD Quality Streaming
🆕 Regular Movie Updates
📱 Fast & Easy to Use
💯 Free Entertainment

✨ Features:
✅ தமிழ் Movies
✅ Hollywood Movies in தமிழ்
✅ Latest Releases
✅ Simple Interface
✅ Mobile Friendly

👇 Download Now

https://play.google.com/store/apps/details?id=com.vipmovies.tvkmovies&pcampaignid=web_share

📢 Share with Friends & Family and Enjoy Unlimited Entertainment!
`;

if(navigator.share){

navigator.share({
title:"TVK Movies",
text:shareText
});

}else{

window.open(
"https://wa.me/?text=" +
encodeURIComponent(shareText),
"_blank"
);

}

});

    let index = 0;

fetch("https://database.akatsuki-pvt-ltd.workers.dev/slider")
.then(res => res.json())
.then(data => {

const slidesContainer = document.getElementById("slidesContainer");
const dotContainer = document.getElementById("dot");

data.forEach((item,i)=>{

slidesContainer.innerHTML += `
<a href="${item.url}">
<div class="slides">
<img class="imggg" src="${item.image}">
</div>
</a>
`;

dotContainer.innerHTML += `<span class="dot"></span>`;

});

startSlider();

});

function startSlider(){

const slides = document.querySelectorAll(".slides");
const dots = document.querySelectorAll(".dot");

function changeSlide(){

if(index >= slides.length){
index = 0;
}

slides.forEach((slide,i)=>{
slide.style.display="none";
dots[i].classList.remove("active");
});

slides[index].style.display="block";
dots[index].classList.add("active");

index++;

setTimeout(changeSlide,2000);

}

changeSlide();

}


    function filterMovie(category,year){
location.href =
"list.html?category="+category+"&year="+year;
}

let allMovies = [];

fetch("https://database.akatsuki-pvt-ltd.workers.dev/movies")
.then(res => res.json())
.then(data => {
    allMovies = data;

    loadSection("Tamil","2026","tamilMovies");
    loadSection("Hollywood","2025","hollywoodMovies");
});


function loadSection(category, year, containerId){

const container = document.getElementById(containerId);
container.innerHTML="";

const movies = allMovies
.filter(m => m.category === category && m.year === year)
.slice(0,10);

movies.forEach(movie => {

const card = document.createElement("a");

card.href = "watch.html?reward=" + movie.id;

/* card box */
const box = document.createElement("div");
box.id="a";

/* movie image */
const img = document.createElement("img");
img.id="ai";
img.src = movie.image;

/* movie title */
const title = document.createElement("h1");
title.id="aitext";
title.innerText = movie.title + " [" + movie.year + "]";

/* append */
box.appendChild(img);
box.appendChild(title);
card.appendChild(box);

container.appendChild(card);

});


/* VIEW ALL CARD */

const viewCard = document.createElement("div");
viewCard.id = "a";
viewCard.style.background = "black";

/* check category */
if(category === "Tamil"){
    viewCard.setAttribute("onclick","filterMovie('Tamil','2026')");
}
else if(category === "Hollywood"){
    viewCard.setAttribute("onclick","filterMovie('Hollywood','2025')");
}

const viewImg = document.createElement("img");
viewImg.id = "va";
viewImg.src = "./m-image/View all.png";

viewCard.appendChild(viewImg);

container.appendChild(viewCard);

}



</script>
