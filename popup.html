<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VIP Movies</title>

<link rel="stylesheet" href="./src/main.css"/>
<script src="./src/main.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap"/>
</head>

<body>

<div class="main">

    <!-- Popup Overlay -->
<div id="sharePopup" class="popup-overlay">
    <div id="shareBtn" class="popup-box">

        <button id="closePopup" class="popup-close">
            ✕
        </button>

        <img src="./src/popup-img.png"
             class="popup-banner"
             alt="Share TVK Movies">

        <div class="popup-content">

            <h2>🎁 Special Offer</h2>

            <h3>
                Share with 10 Friends &
                Watch Ads Free
            </h3>

            <p>
                Share TVK Movies with your friends and family on WhatsApp.
            </p>

            <a href="#" id="shareBtn" class="share-btn">
                📲 Share Now
            </a>

            <div class="countdown">
                Closing in <span id="timer">10</span>s
            </div>

        </div>
    </div>
</div>

    <!-- Overlay -->
    <div id="myNav" class="overlay">
        <img src="./m-image/Close icon.png" class="close" onclick="closeNav()">

        <img src="./m-image/VIP Movies.jpg" class="navimg">

        <a href="index.html">
            <img src="./m-image/N-Home.png" class="navb">
        </a>

        <a href="#">
            <img src="./m-image/N-feedback.png" class="navb">
        </a>

        <a href="#">
            <img src="./m-image/N-about.png" class="navb">
        </a>
    </div>

    <!-- Header -->
    <div class="header">
        <img src="./m-image/Menu icon.png" class="menu" onclick="openNav()">
        <img src="./m-image/Vip Title.png" class="title">
        <a href="search.html">
            <img src="./m-image/Search icon.png" class="search">
        </a>
    </div>



</div>

<style>
    .popup-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.85);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
}

.popup-box{
    width:80%;
    max-width:90%;
    background:#111;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 20px rgba(255,255,0,.3);
    animation:popupScale .3s ease;
}


.popup-banner{
    width:100%;
    display:block;
}

.popup-content{
    padding:20px;
    text-align:center;
}

.popup-content h2{
    color:#ffe600;
    margin-bottom:10px;
}

.popup-content h3{
    color:white;
    margin-bottom:10px;
}

.popup-content p{
    color:#ccc;
    margin-bottom:20px;
}

.share-btn{
    display:block;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}

.countdown{
    margin-top:15px;
    color:#ffe600;
    font-size:18px;
}

.popup-close{
    position:absolute;
    right:10px;
    top:10px;
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:red;
    color:white;
    cursor:pointer;
    font-size:18px;
}
</style>

<script>

const popup = document.getElementById("sharePopup");
const closeBtn = document.getElementById("closePopup");
const timerText = document.getElementById("timer");

let seconds = 10;

const countdown = setInterval(() => {

    seconds--;

    timerText.innerText = seconds;

    if(seconds <= 0){
        clearInterval(countdown);
        popup.style.display = "none";
    }

},1000);

closeBtn.addEventListener("click",()=>{

    clearInterval(countdown);

    popup.style.display = "none";

});


document.getElementById("shareBtn").addEventListener("click",()=>{

const shareText =
`TVK Movies - Tamil Cinemas 🎬

Watch Free Tamil & Hollywood Movies

Download Now:
https://play.google.com/store/apps/details?id=com.vipmovies.tvkmovies`;

if(navigator.share){

navigator.share({
title:"TVK Movies",
text:shareText
});

}else{

window.open(
"https://wa.me/?text=" +
encodeURIComponent(shareText),
"_blank"
);

}

});

</script>

</body>
</html>
